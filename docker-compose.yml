services:
  db:
    image: mysql:8.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugcd-django", "-pdb-gcd"]
      interval: 5s
      timeout: 3s
      # allow ~3 minutes: the very first mysql init can be slow, and
      # giving up here fails `up` where wait.sh used to loop
      retries: 30
      start_period: 30s
    ports:
      - '127.0.0.1:3308:3306'  # host IP:host port:container port; MySQL listens on 3306
    environment:
       MYSQL_DATABASE: 'my-gcd-db'
       MYSQL_USER: 'gcd-django'
       MYSQL_PASSWORD: 'db-gcd'
       MYSQL_ROOT_PASSWORD: 'root-password'
    volumes:
      - db:/var/lib/mysql
  web:
    build: .
    init: true
    command: python gcd-django/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/gcd-django
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MYSQL_DATABASE=my-gcd-db
      - MYSQL_USER=gcd-django
      - MYSQL_PASSWORD=db-gcd
      - MYSQL_ROOT_PASSWORD=root-password 
    depends_on:
      db:
        condition: service_healthy
volumes:
  db:
    driver: local
